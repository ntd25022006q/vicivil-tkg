const Y0=1996, Y1=2030;
function vt(d){return d?d.split("-").reverse().join("/"):""}
function active(l,yy){
  const f=+l.from.slice(0,4), t=l.to?+l.to.slice(0,4):9999;
  return yy>=f && yy<t;
}
function mkS(l){return l.chunks?Math.min(46,14+Math.sqrt(l.chunks)*0.85):9}
function x(v){return (v-Y0)*78-2000}
let chart=echarts.init(document.getElementById("chart"));
let timer=null,cur=2026;
function mark(yy){
  const ns=LAWS.map(l=>{
    const on=active(l,yy);
    return {id:l.id,name:l.name+"\n"+l.sym,x:l.x,y:l.y,symbolSize:on?mkS(l):Math.max(7,mkS(l)*0.55),
      itemStyle:{color:l.color,opacity:on?1:0.22,
        borderColor:on?(l.status==="het_hieu_luc"?"#777":"#fff"):"#333",borderWidth:on?1.5:0.5},
      label:{show:!l.id.startsWith("EXT-"),fontSize:on?11:9,color:on?"#eee":"#555",position:"right",
        backgroundColor:"rgba(16,20,24,.55)",padding:[2,4],borderRadius:3},node:{c:l}};
  });
  const ed=EDGES.map(e=>{
    const live=(+e.at.slice(0,4))<=yy;
    return {source:e.src,target:e.tgt,
      lineStyle:{width:e.relation==="REPLACES"?(live?3:1.2):(live?1.6:0.7),
        type:e.relation==="REPLACES"?"solid":"dashed",opacity:live?1:0.12,
        color:e.relation==="REPLACES"?"#ffe08a":"#8ab4ff",curveness:0.08},label:{show:false}};
  });
  chart.setOption({series:[{type:"graph",layout:"none",roam:true,
    data:ns,links:ed,edgeSymbol:["none","arrow"],edgeSymbolSize:7,
    label:{formatter:"{b}"},
    tooltip:{formatter:p=>{
      if(p.dataType==="edge"){const r=EDGES.find(z=>z.src===p.data.source&&z.tgt===p.data.target);
        return r?r.relation+" ("+vt(r.at)+")<br>"+(r.note||""):""}
      const l=LAWS.find(z=>z.id===p.data.id);
      if(!l)return"";
      const on=active(l,yy);
      return "<b>"+l.full+"</b><br>"+l.sym+"<br>hieu luc: "+vt(l.from)+" &rarr; "+(l.to?vt(l.to):"nay")
        +(on?"<br><b>DANG CO HIEU LUC tai "+yy+"</b>":"<br>(hien khong con hieu luc)")
        +(l.chunks?"<br>"+l.chunks+" chunk | "+l.cites+" danh-chieu":"");
    }},
    emphasis:{focus:"adjacency"}}],title:{text:String(yy),left:20,top:14,textStyle:{fontSize:34,color:"#a8b"}}},true);
}
function setYear(y){cur=+y;document.getElementById("slider").value=y;document.getElementById("year").textContent=y;mark(cur)}
function play(){stop();cur=1995;setYear(1995);timer=setInterval(()=>{if(cur>=2026){stop();return}cur+=1;setYear(cur)},750)}
function stop(){if(timer){clearInterval(timer);timer=null}}
const cats={};LAWS.forEach(l=>{if(!(l.cat in cats))cats[l.cat]=l.color});
document.getElementById("legend").innerHTML=Object.entries(cats)
  .map(([c,k])=>'<span><i class="sw" style="background:'+k+'"></i>'+c+"</span>")
  .join('<span style="opacity:.3">&nbsp;|&nbsp;</span>');
setYear(2026);window.addEventListener("resize",()=>chart.resize());
</script></body></html>
